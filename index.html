<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream — Free Films</title>
<style>
  :root {
    --bg: #0a0a0f; --bg-2: #141419; --bg-3: #1e1e26;
    --text: #f5f5f7; --text-dim: #9a9aa5;
    --accent: #ff0000; --accent-2: #cc0000; --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* HEADER */
  header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 24px; padding: 16px 40px; background: rgba(10,10,15,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
  .logo-mark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 7px; display: grid; place-items: center; position: relative; }
  .logo-mark::after { content: ""; border-left: 10px solid #0a0a0f; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
  .nav { display: flex; gap: 22px; font-size: 0.92rem; color: var(--text-dim); }
  .nav a:hover, .nav a.active { color: var(--text); }
  .search { margin-left: auto; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 14px; width: 280px; }
  .search:focus-within { border-color: var(--accent); }
  .search svg { width: 16px; height: 16px; fill: var(--text-dim); flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-size: 0.9rem; }
  .search input::placeholder { color: var(--text-dim); }

  /* HERO */
  .hero { position: relative; height: 70vh; min-height: 480px; display: flex; align-items: flex-end; padding: 0 40px 60px; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 30%; filter: brightness(0.5); transition: background-image 0.6s; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, transparent 40%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.5) 45%, transparent 75%); pointer-events: none; }
  .hero-content { position: relative; z-index: 2; max-width: 640px; }
  .hero-badge { display: inline-flex; background: rgba(255,0,0,0.15); color: #ff4444; padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; }
  .hero-title { font-size: clamp(1.8rem, 4.5vw, 3.4rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; margin-bottom: 14px; }
  .hero-desc { font-size: 1rem; line-height: 1.55; color: #d0d0d5; margin-bottom: 24px; max-width: 560px; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* GRID */
  main { padding: 0 40px 80px; margin-top: -40px; position: relative; z-index: 5; }
  .section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; margin-top: 20px; }
  .section-header h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
  .section-header .count { font-size: 0.85rem; color: var(--text-dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .card { position: relative; cursor: pointer; transition: transform 0.2s ease; }
  .card:hover { transform: translateY(-4px); }
  .card-thumb { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; background: var(--bg-3); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .card:hover .card-thumb img { transform: scale(1.06); }
  .card-thumb .play { position: absolute; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.2s; display: grid; place-items: center; }
  .card:hover .card-thumb .play { opacity: 1; }
  .play-circle { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); position: relative; box-shadow: 0 8px 24px rgba(255,0,0,0.5); }
  .play-circle::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-40%,-50%); border-left: 14px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .card-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: 600; color: #fff; letter-spacing: 0.3px; text-transform: uppercase; z-index: 2; }
  .card-title { font-size: 0.9rem; font-weight: 600; margin-top: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .card-title.loading { color: var(--text-dim); font-weight: 400; font-style: italic; }
  .card-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

  /* EMPTY */
  .empty { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 8px; }

  /* MODAL */
  .modal { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.94); display: none; overflow-y: auto; padding: 20px; backdrop-filter: blur(10px); }
  .modal.open { display: block; }
  .modal-inner { max-width: 1200px; margin: 0 auto; }
  .modal-close { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff; display: grid; place-items: center; z-index: 510; }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-close svg { width: 22px; height: 22px; fill: currentColor; }
  .frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); margin-top: 40px; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modal-info { margin-top: 22px; }
  .modal-info h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 14px; }
  .modal-info .btn { margin-top: 10px; }

  footer { padding: 40px; border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.85rem; text-align: center; line-height: 1.7; }

  @media (max-width: 780px) {
    header { padding: 14px 20px; gap: 14px; }
    .nav { display: none; }
    .search { width: 180px; }
    .logo { font-size: 1.15rem; }
    .hero { padding: 0 20px 40px; height: 60vh; }
    main { padding: 0 20px 60px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .modal-info h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <a href="#" class="logo"><span class="logo-mark"></span>Stream</a>
  <nav class="nav">
    <a href="#" class="active">Home</a>
    <a href="#films">Films</a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Search films...">
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <div class="hero-badge">Featured</div>
    <h1 class="hero-title" id="heroTitle">Loading…</h1>
    <p class="hero-desc" id="heroDesc">Fetching titles from YouTube…</p>
    <div class="hero-actions">
      <button class="btn btn-primary" id="heroPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play now</button>
    </div>
  </div>
</section>

<main id="films">
  <div class="section-header">
    <h2>All Films</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div><strong style="color:var(--text)">Stream</strong> — Free films, embedded from YouTube.</div>
  <div>All videos play from their original YouTube upload. No files are hosted here.</div>
</footer>

<div class="modal" id="playerModal">
  <button class="modal-close" id="modalClose"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <div class="modal-inner">
    <div class="frame"><iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div class="modal-info">
      <h1 id="modalTitle"></h1>
      <a class="btn btn-secondary" id="modalSource" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3z"/></svg>
        Watch on YouTube
      </a>
    </div>
  </div>
</div>

<script>
/* ============================================================
   FILM LIST — 45 films from the URLs you sent.
   Add more by pasting just the YouTube ID (the part after "v=").
   ============================================================ */
const VIDEO_IDS = [
  // Top of your list
  "u4PKVGDGkps",  // Frank and Jesse (1994)
  "3ZOV4YhquXI",  // Meet John Doe (1941)
  "vNYg4YWkp0k",  // Carnival of Souls (1962)
  "IpDosODDwK8",  // Night of the Living Dead (1968)
  "dOWoT5gwHkY",
  "UTvWXh7cQB0",
  "i8yVTqmxaSc",
  "gT4M2UrDFUs",
  "T3bjXQkQsMw",
  "xVgldYEoSoA",
  "bXe-fv-K24k",
  "kgxhEq8w9xw",
  "uVQaOmcgm-E",
  "yE_dS6GMR1U",
  "Z7c_dzk1Mik",
  "i8TIPVIFmPY",
  "PR4ScfUhO8U",
  "-gw8Do-p7Ek",
  "sq332B26oLY",
  "7YkiBw6ZZBY",
  "dStE0e8DeM4",
  "sU6wC6FC72U",
  "jvVg8sj6jNA",
  "11h20KZIQl0",
  "U9kHFueuZos",
  "okl_uBgpajU",
  "lwrEQg33ljg",
  "UC89LKqUQ7I",
  "5xe2RxIbOps",
  "VMgzQjsNqzk",  // Mughal-e-Azam
  "dweyaU3nWEI",
  "uP6bB-OOnSM",  // Sholay
  "3easnWEGMvw",  // Kids movies
  "HfEVEGf1A8Q",  // Kids movies
  "hcAchkiY4wo",  // DC movies
  "CLZJI1673Sg",  // Sci-fi
  "E7sUYWVD8Fw",  // Animated
  // Bottom of your list
  "rzQNLGIb6wI",
  "K2AUo8ShkNg",
  "gO16NAvdH3U",
  "YTUweaAqaiM",
  "4qMEl5R-LMI",
  "m9UKyhbsT9U",
  "zNs7Mqe7Z0A",
  "n1afpoOYXSw"
];

/* ============================================================
   RENDER LOGIC — no need to edit below this line
   ============================================================ */
const $ = s => document.querySelector(s);
const posterUrl = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const embedUrl  = id => `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
const sourceUrl = id => `https://www.youtube.com/watch?v=${id}`;

const grid = $("#grid");
const cards = new Map(); // id -> { card, titleEl }
const filmData = new Map(); // id -> { title, author }

function escapeHtml(s) { return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function buildCard(id, index) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-thumb">
      <span class="card-badge">YouTube</span>
      <img src="${posterUrl(id)}" loading="lazy" alt="">
      <div class="play"><div class="play-circle"></div></div>
    </div>
    <div class="card-title loading">Loading title…</div>
    <div class="card-sub">YouTube</div>
  `;
  card.addEventListener("click", () => openPlayer(id));
  return card;
}

function render(films) {
  grid.innerHTML = "";
  films.forEach((id, i) => {
    const card = buildCard(id, i);
    grid.appendChild(card);
    // Restore title if we already fetched it
    if (filmData.has(id)) {
      const el = card.querySelector(".card-title");
      el.textContent = filmData.get(id).title;
      el.classList.remove("loading");
    }
    cards.set(id, card);
  });
  $("#count").textContent = `${films.length} film${films.length !== 1 ? "s" : ""}`;
}

/* ---------- Fetch real title from YouTube oEmbed ---------- */
async function fetchTitle(id) {
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

async function loadAllTitles() {
  // Process in small batches to avoid hammering the endpoint
  const ids = VIDEO_IDS.filter(id => !filmData.has(id));
  const batchSize = 5;
  for (let i = 0; i < ids.length; i += batchSize) {
    const batch = ids.slice(i, i + batchSize);
    await Promise.all(batch.map(async id => {
      const data = await fetchTitle(id);
      if (data && data.title) {
        filmData.set(id, { title: data.title, author: data.author_name || "" });
        const card = cards.get(id);
        if (card) {
          const titleEl = card.querySelector(".card-title");
          titleEl.textContent = data.title;
          titleEl.classList.remove("loading");
          card.querySelector(".card-sub").textContent = data.author_name || "YouTube";
        }
      } else {
        // Mark as failed
        const card = cards.get(id);
        if (card) {
          const titleEl = card.querySelector(".card-title");
          titleEl.textContent = "Video unavailable";
          titleEl.classList.remove("loading");
          titleEl.style.color = "#6b6b75";
          card.querySelector(".card-sub").textContent = id;
        }
      }
    }));
  }
  // Once first title comes in, set hero
  const first = VIDEO_IDS.find(id => filmData.has(id));
  if (first) setHero(first);
}

/* ---------- Hero ---------- */
function setHero(id) {
  const data = filmData.get(id);
  $("#heroBg").style.backgroundImage = `url(https://i.ytimg.com/vi/${id}/maxresdefault.jpg)`;
  $("#heroTitle").textContent = data ? data.title : id;
  $("#heroDesc").textContent = data && data.author ? `From ${data.author}` : "Free film on YouTube.";
  $("#heroPlay").onclick = () => openPlayer(id);
}

/* ---------- Player ---------- */
function openPlayer(id) {
  $("#playerFrame").src = embedUrl(id);
  const data = filmData.get(id);
  $("#modalTitle").textContent = data ? data.title : "Loading…";
  $("#modalSource").href = sourceUrl(id);
  $("#playerModal").classList.add("open");
  document.body.style.overflow = "hidden";
  if (!data) {
    fetchTitle(id).then(d => {
      if (d) {
        filmData.set(id, { title: d.title, author: d.author_name });
        $("#modalTitle").textContent = d.title;
      } else {
        $("#modalTitle").textContent = "Video unavailable";
      }
    });
  }
}
function closePlayer() {
  $("#playerModal").classList.remove("open");
  $("#playerFrame").src = "";
  document.body.style.overflow = "";
}
$("#modalClose").onclick = closePlayer;
$("#playerModal").onclick = e => { if (e.target.id === "playerModal") closePlayer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

/* ---------- Search ---------- */
$("#searchInput").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { render(VIDEO_IDS); return; }
  const filtered = VIDEO_IDS.filter(id => {
    const d = filmData.get(id);
    const hay = ((d && d.title) || id).toLowerCase();
    return hay.includes(q);
  });
  render(filtered);
});

/* ---------- Init ---------- */
render(VIDEO_IDS);
setHero(VIDEO_IDS[0]);
loadAllTitles();
</script>
</body>
</html>
