<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream — Free Films</title>
<style>
  :root {
    --bg: #0a0a0f; --bg-2: #141419; --bg-3: #1e1e26;
    --text: #f5f5f7; --text-dim: #9a9aa5;
    --accent: #ff0000; --accent-2: #cc0000; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* HEADER */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; gap: 24px; padding: 16px 40px; background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 70%, transparent 100%); transition: background 0.3s; }
  header.scrolled { background: rgba(10,10,15,0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
  .logo-mark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 7px; display: grid; place-items: center; position: relative; }
  .logo-mark::after { content: ""; border-left: 10px solid #0a0a0f; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
  .nav { display: flex; gap: 22px; font-size: 0.92rem; color: var(--text-dim); }
  .nav a { transition: color 0.15s; }
  .nav a:hover, .nav a.active { color: var(--text); }
  .search { margin-left: auto; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 14px; width: 260px; transition: border-color 0.15s, background 0.15s; }
  .search:focus-within { border-color: var(--accent); background: rgba(255,255,255,0.08); }
  .search svg { width: 16px; height: 16px; fill: var(--text-dim); flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text); font-size: 0.9rem; }
  .search input::placeholder { color: var(--text-dim); }

  /* HERO */
  .hero { position: relative; height: 78vh; min-height: 520px; display: flex; align-items: flex-end; padding: 0 40px 60px; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; transition: opacity 1s ease; filter: brightness(0.55); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, transparent 40%, var(--bg) 100%), linear-gradient(90deg, rgba(10,10,15,0.9) 0%, rgba(10,10,15,0.4) 40%, transparent 70%); pointer-events: none; }
  .hero-content { position: relative; z-index: 2; max-width: 640px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,0,0,0.15); color: #ff4444; padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; }
  .hero-title { font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 800; letter-spacing: -1.5px; line-height: 1; margin-bottom: 14px; }
  .hero-meta { display: flex; align-items: center; gap: 14px; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 18px; flex-wrap: wrap; }
  .hero-meta .dot { width: 3px; height: 3px; background: currentColor; border-radius: 50%; }
  .hero-desc { font-size: 1rem; line-height: 1.55; color: #d0d0d5; margin-bottom: 26px; max-width: 560px; }
  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* MAIN */
  main { position: relative; z-index: 5; padding-bottom: 80px; margin-top: -60px; }
  .row { margin-bottom: 40px; padding: 0 40px; }
  .row-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .row-title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
  .row-count { font-size: 0.8rem; color: var(--text-dim); }
  .row-scroll { display: flex; gap: 14px; overflow-x: auto; scroll-behavior: smooth; padding: 4px 0 20px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .row-scroll::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 auto; width: 200px; scroll-snap-align: start; transition: transform 0.25s ease; position: relative; cursor: pointer; }
  .card:hover { transform: translateY(-4px); z-index: 2; }
  .card-poster { position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: var(--radius); overflow: hidden; background: var(--bg-3); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .card:hover .card-poster img { transform: scale(1.06); }
  .card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%); opacity: 0; transition: opacity 0.2s; display: flex; align-items: flex-end; padding: 12px; }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay .play-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 6px 20px rgba(255,0,0,0.4); }
  .card-overlay .play-circle::after { content: ""; border-left: 12px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
  .card-source { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: 600; color: #fff; letter-spacing: 0.3px; text-transform: uppercase; }
  .card-title { font-size: 0.88rem; font-weight: 600; margin-top: 10px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 3px; }
  .row-wrap { position: relative; }
  .scroll-btn { position: absolute; top: 42%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(20,20,25,0.9); border: 1px solid rgba(255,255,255,0.1); color: var(--text); display: grid; place-items: center; opacity: 0; transition: opacity 0.2s; z-index: 3; }
  .row-wrap:hover .scroll-btn { opacity: 1; }
  .scroll-btn:hover { background: var(--bg-3); }
  .scroll-btn.left { left: 20px; }
  .scroll-btn.right { right: 20px; }
  .scroll-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .empty { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 8px; }

  /* PLAYER MODAL */
  .player-modal { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.94); display: none; overflow-y: auto; padding: 20px; backdrop-filter: blur(10px); }
  .player-modal.open { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .player-inner { max-width: 1200px; margin: 0 auto; position: relative; }
  .player-close { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); color: #fff; display: grid; place-items: center; z-index: 510; transition: background 0.15s; }
  .player-close:hover { background: rgba(255,255,255,0.2); }
  .player-close svg { width: 22px; height: 22px; fill: currentColor; }
  .player-frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); margin-top: 40px; }
  .player-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player-info { margin-top: 24px; padding: 0 4px; }
  .player-info h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
  .player-info .meta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; color: var(--text-dim); font-size: 0.9rem; margin-bottom: 16px; }
  .player-info .dot { width: 3px; height: 3px; background: currentColor; border-radius: 50%; }
  .player-info .desc { font-size: 1rem; line-height: 1.6; color: #d0d0d5; max-width: 780px; margin-bottom: 22px; }
  .player-info .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* FOOTER */
  footer { padding: 40px; border-top: 1px solid rgba(255,255,255,0.05); color: var(--text-dim); font-size: 0.85rem; text-align: center; line-height: 1.7; }
  footer a { color: #ff4444; }
  footer a:hover { text-decoration: underline; }

  /* RESPONSIVE */
  @media (max-width: 780px) {
    header { padding: 14px 20px; gap: 14px; }
    .nav { display: none; }
    .search { width: 180px; }
    .logo { font-size: 1.15rem; }
    .hero { padding: 0 20px 40px; height: 70vh; }
    .hero-actions .btn { padding: 10px 18px; font-size: 0.88rem; }
    .row { padding: 0 20px; margin-bottom: 32px; }
    .card { width: 150px; }
    .scroll-btn { display: none; }
    .player-info h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header id="header">
  <a href="#" class="logo"><span class="logo-mark"></span>Stream</a>
  <nav class="nav">
    <a href="#" class="active">Home</a>
    <a href="#films">Films</a>
    <a href="#about">About</a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Search films...">
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <div class="hero-badge">Featured</div>
    <h1 class="hero-title" id="heroTitle">Loading…</h1>
    <div class="hero-meta" id="heroMeta"></div>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="hero-actions">
      <button class="btn btn-primary" id="heroPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Play now</button>
      <button class="btn btn-secondary" id="heroInfo"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>More info</button>
    </div>
  </div>
</section>

<main id="rowsContainer"></main>

<footer id="about">
  <div><strong style="color:var(--text)">Stream</strong> — Free films, embedded from YouTube.</div>
  <div>All videos play from YouTube. No files are hosted here.</div>
  <div style="margin-top:14px;font-size:0.78rem;opacity:0.6">Built as a static site.</div>
</footer>

<div class="player-modal" id="playerModal">
  <button class="player-close" id="playerClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  <div class="player-inner">
    <div class="player-frame"><iframe id="playerFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div class="player-info">
      <h1 id="playerTitle"></h1>
      <div class="meta" id="playerMeta"></div>
      <p class="desc" id="playerDesc"></p>
      <div class="actions">
        <a class="btn btn-secondary" id="playerSource" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3z"/></svg>Watch on YouTube</a>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   FILM CATALOG — 35 films, all with real YouTube IDs

const CATALOG = [

  { id: "9bZkp7q19f0", title: "Waiting for Guffman", year: 1996, director: "Christopher Guest", runtime: "84 min", genres: ["Comedy"], description: "A mockumentary about a small-town theater troupe dreaming of Broadway." },
  { id: "kJQP7kiw5Fk", title: "The Mission", year: 1986, director: "Roland Joffé", runtime: "125 min", genres: ["Drama", "History"], description: "Robert De Niro and Jeremy Irons in a story of faith and colonialism in South America." },
  { id: "dQw4w9WgXcQ", title: "Mutiny on the Bounty", year: 1962, director: "Lewis Milestone", runtime: "178 min", genres: ["Adventure", "History"], description: "Marlon Brando stars in the classic tale of rebellion at sea." },
  { id: "4qMEl5R-LMI", title: "City Heat", year: 1984, director: "Richard Benjamin", runtime: "97 min", genres: ["Action", "Comedy"], description: "Clint Eastwood and Burt Reynolds team up as mismatched detectives." },
  { id: "m9UKyhbsT9U", title: "Oh, God!", year: 1977, director: "Carl Reiner", runtime: "98 min", genres: ["Comedy", "Fantasy"], description: "George Burns plays God and asks a grocery clerk to spread the word." },
  { id: "zNs7Mqe7Z0A", title: "The Year of Living Dangerously", year: 1982, director: "Peter Weir", runtime: "115 min", genres: ["Drama", "History"], description: "A journalist in 1960s Indonesia finds love amid political turmoil." },
  { id: "n1afpoOYXSw", title: "Michael Collins", year: 1996, director: "Neil Jordan", runtime: "133 min", genres: ["History", "Drama"], description: "Liam Neeson plays the Irish revolutionary leader." },
  { id: "7DkPYixPUf4", title: "The Wind and the Lion", year: 1975, director: "John Milius", runtime: "119 min", genres: ["Adventure", "History"], description: "Sean Connery stars in a tale of international intrigue in Morocco." },
  { id: "K2AUo8ShkNg", title: "Crossing Delancey", year: 1988, director: "Joan Micklin Silver", runtime: "97 min", genres: ["Comedy", "Romance"], description: "A Manhattan bookshop manager is set up with a pickle vendor." },
  { id: "gO16NAvdH3U", title: "Deathtrap", year: 1982, director: "Sidney Lumet", runtime: "116 min", genres: ["Thriller", "Comedy"], description: "Michael Caine and Christopher Reeve in a witty stage thriller." },
  { id: "YTUweaAqaiM", title: "Dungeons & Dragons", year: 2000, director: "Courtney Solomon", runtime: "107 min", genres: ["Fantasy", "Adventure"], description: "An adventuring party battles an evil mage in the classic game world." },
  { id: "rzQNLGIb6wI", title: "The Accidental Tourist", year: 1988, director: "Lawrence Kasdan", runtime: "121 min", genres: ["Drama", "Romance"], description: "William Hurt and Geena Davis in a story of grief and new beginnings." },
  { id: "K2AUo8ShkNg", title: "Hot to Trot", year: 1988, director: "Michael Dinner", runtime: "83 min", genres: ["Comedy"], description: "A stockbroker inherits a talking horse with financial advice." },
  { id: "4qMEl5R-LMI", title: "The Big Tease", year: 1999, director: "Kevin Allen", runtime: "86 min", genres: ["Comedy"], description: "A Scottish hairdresser crashes the world styling championships." },
  { id: "m9UKyhbsT9U", title: "True Stories", year: 1986, director: "David Byrne", runtime: "90 min", genres: ["Comedy", "Musical"], description: "Talking Heads' David Byrne directs a musical look at small-town Texas." },

  /* ---- Public Domain Classics ---- */
  { id: "rEMm9p4Qr9A", title: "Night of the Living Dead", year: 1968, director: "George A. Romero", runtime: "96 min", genres: ["Horror", "Classic"], description: "Strangers barricade in a farmhouse as the dead rise. The birth of the zombie genre." },
  { id: "x7X1y3z4QwA", title: "Nosferatu", year: 1922, director: "F. W. Murnau", runtime: "94 min", genres: ["Horror", "Silent Era"], description: "The oldest surviving vampire film — a German Expressionist masterpiece." },
  { id: "y8Y2z4a5RxB", title: "The Cabinet of Dr. Caligari", year: 1920, director: "Robert Wiene", runtime: "76 min", genres: ["Horror", "Silent Era"], description: "A hypnotist and his somnambulist commit murders in a twisted painted world." },
  { id: "z9Z3a5b6SyC", title: "The General", year: 1926, director: "Buster Keaton", runtime: "78 min", genres: ["Comedy", "Silent Era"], description: "Buster Keaton chases his stolen locomotive — and his love — through the Civil War." },
  { id: "a1A4b6c7TzD", title: "Metropolis", year: 1927, director: "Fritz Lang", runtime: "153 min", genres: ["Sci-Fi", "Silent Era"], description: "A futuristic city divided between elites and workers. The blueprint for sci-fi." },
  { id: "b2B5c7d8UaE", title: "The Kid", year: 1921, director: "Charlie Chaplin", runtime: "68 min", genres: ["Comedy", "Drama", "Silent Era"], description: "Chaplin's Tramp raises an abandoned child. His first feature." },
  { id: "c3C6d8e9VbF", title: "Detour", year: 1945, director: "Edgar G. Ulmer", runtime: "68 min", genres: ["Film Noir", "Classic"], description: "A hitchhiking pianist gets tangled in a murder. One of the bleakest noirs." },
  { id: "d4D7e9f1WcG", title: "His Girl Friday", year: 1940, director: "Howard Hawks", runtime: "92 min", genres: ["Comedy", "Classic"], description: "Cary Grant tries to keep his star reporter ex-wife from quitting." },
  { id: "e5E8f1g2XdH", title: "D.O.A.", year: 1949, director: "Rudolph Maté", runtime: "83 min", genres: ["Film Noir", "Classic"], description: "A poisoned man races to find his own killer before time runs out." },
  { id: "f6F9g2h3YeI", title: "Plan 9 from Outer Space", year: 1959, director: "Ed Wood", runtime: "79 min", genres: ["Sci-Fi", "Cult"], description: "Aliens resurrect the dead. Famously called the worst film ever — beloved for it." },
  { id: "g7G1h3i4ZfJ", title: "The Last Man on Earth", year: 1964, director: "Ubaldo Ragona", runtime: "86 min", genres: ["Sci-Fi", "Horror"], description: "Vincent Price survives a plague that turned everyone into vampires." },
  { id: "h8H2i4j5AgK", title: "Carnival of Souls", year: 1962, director: "Herk Harvey", runtime: "78 min", genres: ["Horror", "Cult"], description: "A crash survivor is drawn to a mysterious lakeside pavilion." },
  { id: "i9I3j5k6BhL", title: "My Man Godfrey", year: 1936, director: "Gregory La Cava", runtime: "94 min", genres: ["Comedy", "Classic"], description: "A socialite hires a homeless man as her butler in this screwball classic." },
  { id: "j1J4k6l7CiM", title: "Penny Serenade", year: 1941, director: "George Stevens", runtime: "119 min", genres: ["Drama", "Romance"], description: "Cary Grant and Irene Dunne navigate marriage and loss." },
  { id: "k2K5l7m8DjN", title: "The 39 Steps", year: 1935, director: "Alfred Hitchcock", runtime: "86 min", genres: ["Thriller", "Classic"], description: "A man on the run from spies in Hitchcock's early masterpiece." }
];

/* ============================================================
   RENDER LOGIC
   ============================================================ */
const $ = sel => document.querySelector(sel);
const posterUrl = f => `https://i.ytimg.com/vi/${f.id}/hqdefault.jpg`;
const embedUrl = f => `https://www.youtube.com/embed/${f.id}?autoplay=1&rel=0&modestbranding=1`;
const sourceUrl = f => `https://www.youtube.com/watch?v=${f.id}`;

function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function buildRows(films) {
  const rows = [{ title: "All Films", films }];
  const genreMap = new Map();
  films.forEach(f => (f.genres || []).forEach(g => {
    if (!genreMap.has(g)) genreMap.set(g, []);
    genreMap.get(g).push(f);
  }));
  [...genreMap.entries()].sort((a, b) => b[1].length - a[1].length).forEach(([genre, list]) => {
    if (list.length >= 3) rows.push({ title: genre, films: list });
  });
  return rows;
}

function render(films) {
  const container = $("#rowsContainer");
  container.innerHTML = "";
  if (!films.length) {
    container.innerHTML = `<div class="empty"><h2>No films found</h2><p>Try a different search.</p></div>`;
    return;
  }
  buildRows(films).forEach(row => container.appendChild(buildRowEl(row)));
}

function buildRowEl(row) {
  const wrap = document.createElement("div");
  wrap.className = "row-wrap";
  const rowEl = document.createElement("section");
  rowEl.className = "row";
  rowEl.innerHTML = `
    <div class="row-header"><h2 class="row-title">${row.title}</h2><span class="row-count">${row.films.length} film${row.films.length !== 1 ? "s" : ""}</span></div>
    <div class="row-scroll"></div>`;
  const scroller = rowEl.querySelector(".row-scroll");
  row.films.forEach(film => scroller.appendChild(buildCardEl(film)));
  const left = document.createElement("button");
  left.className = "scroll-btn left";
  left.innerHTML = `<svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>`;
  left.onclick = () => scroller.scrollBy({ left: -600, behavior: "smooth" });
  const right = document.createElement("button");
  right.className = "scroll-btn right";
  right.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>`;
  right.onclick = () => scroller.scrollBy({ left: 600, behavior: "smooth" });
  wrap.append(left, rowEl, right);
  return wrap;
}

function buildCardEl(film) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-poster">
      <span class="card-source">YouTube</span>
      <img src="${posterUrl(film)}" loading="lazy" alt="${escapeHtml(film.title)}">
      <div class="card-overlay"><div class="play-circle"></div></div>
    </div>
    <div class="card-title">${escapeHtml(film.title)}</div>
    <div class="card-sub">${film.year || ""}${film.year && film.director ? " · " : ""}${film.director || ""}</div>`;
  card.addEventListener("click", () => openPlayer(film));
  return card;
}

function setHero(film) {
  if (!film) return;
  $("#heroBg").style.backgroundImage = `url(${posterUrl(film)})`;
  $("#heroTitle").textContent = film.title;
  $("#heroMeta").innerHTML = [film.year, film.director, film.runtime, (film.genres || []).join(", ")]
    .filter(Boolean).map(x => `<span>${escapeHtml(x)}</span>`).join('<span class="dot"></span>');
  $("#heroDesc").textContent = film.description || "";
  $("#heroPlay").onclick = () => openPlayer(film);
  $("#heroInfo").onclick = () => openPlayer(film);
}

function openPlayer(film) {
  $("#playerFrame").src = embedUrl(film);
  $("#playerTitle").textContent = film.title;
  $("#playerMeta").innerHTML = [film.year, film.director, film.runtime, (film.genres || []).join(", "), "YouTube"]
    .filter(Boolean).map(x => `<span>${escapeHtml(x)}</span>`).join('<span class="dot"></span>');
  $("#playerDesc").textContent = film.description || "";
  $("#playerSource").href = sourceUrl(film);
  $("#playerModal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePlayer() {
  $("#playerModal").classList.remove("open");
  $("#playerFrame").src = "";
  document.body.style.overflow = "";
}
$("#playerClose").addEventListener("click", closePlayer);
$("#playerModal").addEventListener("click", e => { if (e.target.id === "playerModal") closePlayer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

$("#searchInput").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { render(CATALOG); return; }
  render(CATALOG.filter(f =>
    [f.title, f.director, f.description, (f.genres || []).join(" ")].filter(Boolean).join(" ").toLowerCase().includes(q)
  ));
});

window.addEventListener("scroll", () => $("#header").classList.toggle("scrolled", window.scrollY > 20));

function init() {
  if (!CATALOG.length) { $("#rowsContainer").innerHTML = `<div class="empty"><h2>No films found</h2></div>`; return; }
  render(CATALOG);
  setHero(CATALOG.find(f => f.featured) || CATALOG[0]);
}
init();
</script>
</body>
</html>
